<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.ico-receta{animation:recetaFloat 3.5s ease-in-out infinite;}
@keyframes recetaFloat{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.whisk{animation:whiskSpin 4s ease-in-out infinite;}
@keyframes whiskSpin{0%,100%{transform:rotate(-10deg) translate(0,0)}50%{transform:rotate(5deg) translate(2px,-2px)}}
.line1{animation:lineWrite 3s ease-in-out infinite;}
.line2{animation:lineWrite 3s ease-in-out infinite .4s;}
.line3{animation:lineWrite 3s ease-in-out infinite .8s;}
@keyframes lineWrite{0%,100%{opacity:.6}50%{opacity:1}}
</style>
<rect x="16" y="9" width="18" height="22" rx="3" fill="#B8C8E0" opacity=".6"/>
<g class="ico-receta">
  <rect x="10" y="11" width="18" height="22" rx="3" fill="#E8F0FE" stroke="#90A4C0" stroke-width="1.2"/>
  <line class="line1" x1="13" y1="17" x2="25" y2="17" stroke="#5C7A9F" stroke-width="1.5" stroke-linecap="round"/>
  <line class="line2" x1="13" y1="21" x2="25" y2="21" stroke="#5C7A9F" stroke-width="1.5" stroke-linecap="round"/>
  <line class="line3" x1="13" y1="25" x2="21" y2="25" stroke="#5C7A9F" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g class="whisk" style="transform-origin:30px 30px">
  <rect x="27" y="26" width="3.5" height="10" rx="1.7" fill="#E8A030"/>
  <rect x="27.5" y="26" width="2.5" height="3" rx="1" fill="#F6C060"/>
  <path d="M25 18 Q22 24 28.5 26" stroke="#CCC" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M29 17 Q26 23 28.5 26" stroke="#DDD" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M33 18 Q36 24 28.5 26" stroke="#CCC" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M31 17 Q34 23 28.5 26" stroke="#DDD" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="29" cy="18" rx="4" ry="2" stroke="#BBB" stroke-width="1" fill="none"/>
</g>
</svg>
