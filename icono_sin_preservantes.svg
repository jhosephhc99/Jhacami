<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.draw-circle{stroke-dasharray:113;stroke-dashoffset:113;animation:drawCircle 5.5s ease-out infinite;}
.draw-slash{stroke-dasharray:40;stroke-dashoffset:40;animation:drawSlash 5.5s ease-out infinite;}
@keyframes drawCircle{0%{stroke-dashoffset:113;opacity:1}50%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.85}}
@keyframes drawSlash{0%,30%{stroke-dashoffset:40}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.leaf1{animation:leafSway1 2.5s ease-in-out infinite;}
.leaf2{animation:leafSway2 2.5s ease-in-out infinite .4s;}
@keyframes leafSway1{0%,100%{transform-origin:13px 30px;transform:rotate(-4deg)}50%{transform-origin:13px 30px;transform:rotate(4deg)}}
@keyframes leafSway2{0%,100%{transform-origin:20px 33px;transform:rotate(3deg)}50%{transform-origin:20px 33px;transform:rotate(-4deg)}}
</style>
<rect x="14" y="12" width="16" height="18" rx="3" fill="#8B9BAD" opacity=".7"/>
<rect x="15" y="10" width="14" height="4" rx="2" fill="#6B7A8D" opacity=".8"/>
<rect x="14" y="18" width="16" height="6" fill="#E8A057" opacity=".6"/>
<g class="leaf1">
  <ellipse cx="13" cy="28" rx="5" ry="3" fill="#4CAF50" transform="rotate(-30 13 28)"/>
  <line x1="13" y1="28" x2="10" y2="25" stroke="#388E3C" stroke-width="1" stroke-linecap="round"/>
</g>
<g class="leaf2">
  <ellipse cx="20" cy="31" rx="5" ry="3" fill="#66BB6A" transform="rotate(15 20 31)"/>
  <line x1="20" y1="31" x2="23" y2="28" stroke="#388E3C" stroke-width="1" stroke-linecap="round"/>
</g>
<circle class="draw-circle" cx="22" cy="22" r="18" stroke="#E53935" stroke-width="2.5" fill="none"/>
<line class="draw-slash" x1="8" y1="8" x2="36" y2="36" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
</svg>
