<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <defs>

    <linearGradient id="lthR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#232f50"/>
      <stop offset="20%"  stop-color="#16203a"/>
      <stop offset="45%"  stop-color="#1e2d52"/>
      <stop offset="70%"  stop-color="#141e3c"/>
      <stop offset="100%" stop-color="#111a38"/>
    </linearGradient>

    <filter id="ftexR" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feBlend in="SourceGraphic" in2="gn" mode="multiply" result="bl"/>
      <feComposite in="bl" in2="SourceGraphic" operator="in"/>
    </filter>

    <linearGradient id="gldR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f7e888"/>
      <stop offset="10%"  stop-color="#b8860b"/>
      <stop offset="28%"  stop-color="#ecca44"/>
      <stop offset="46%"  stop-color="#fdf5b0"/>
      <stop offset="62%"  stop-color="#d4a012"/>
      <stop offset="80%"  stop-color="#9a6e00"/>
      <stop offset="100%" stop-color="#7a5000"/>
    </linearGradient>

    <linearGradient id="araR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff4b0"/>
      <stop offset="22%"  stop-color="#e8bc22"/>
      <stop offset="48%"  stop-color="#f8dc68"/>
      <stop offset="68%"  stop-color="#c89214"/>
      <stop offset="100%" stop-color="#9a6800"/>
    </linearGradient>

    <filter id="frelR">
      <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#000a20" flood-opacity="0.75"/>
    </filter>
    <filter id="fglowR">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="diamR" x1="95%" y1="5%" x2="5%" y2="95%">
      <stop offset="0%"   stop-color="#fffde8"/>
      <stop offset="15%"  stop-color="#f8dc48"/>
      <stop offset="38%"  stop-color="#fdf4b0"/>
      <stop offset="60%"  stop-color="#c89014"/>
      <stop offset="82%"  stop-color="#8a6002"/>
      <stop offset="100%" stop-color="#5a3e00"/>
    </linearGradient>

    <radialGradient id="ballR" cx="68%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#fffde8"/>
      <stop offset="18%"  stop-color="#f8dc48"/>
      <stop offset="48%"  stop-color="#c89014"/>
      <stop offset="78%"  stop-color="#8a6002"/>
      <stop offset="100%" stop-color="#4e3600"/>
    </radialGradient>

    <linearGradient id="tcupR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#8a6002"/>
      <stop offset="30%"  stop-color="#d4a014"/>
      <stop offset="55%"  stop-color="#f0d050"/>
      <stop offset="78%"  stop-color="#c49010"/>
      <stop offset="100%" stop-color="#8a6002"/>
    </linearGradient>

    <linearGradient id="thlR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#8a6002"/>
      <stop offset="20%"  stop-color="#c8900e"/>
      <stop offset="45%"  stop-color="#f2d452"/>
      <stop offset="68%"  stop-color="#d4a214"/>
      <stop offset="100%" stop-color="#8a6002"/>
    </linearGradient>

    <filter id="fshadowR" x="-8%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="-2" dy="8" stdDeviation="10" flood-color="#000818" flood-opacity="0.55"/>
    </filter>

    <linearGradient id="lsweepR" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="38%"  stop-color="white" stop-opacity="0"/>
      <stop offset="48%"  stop-color="white" stop-opacity="0.22"/>
      <stop offset="52%"  stop-color="white" stop-opacity="0.42"/>
      <stop offset="58%"  stop-color="white" stop-opacity="0.18"/>
      <stop offset="72%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-560 0" to="640 0" dur="4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.35 0 0.65 1"/>
    </linearGradient>

    <linearGradient id="gldsweepR" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="44%"  stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.6"/>
      <stop offset="56%"  stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-560 0" to="640 0" dur="4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.35 0 0.65 1"/>
    </linearGradient>

    <clipPath id="cOuterR">
      <!-- punta a la IZQUIERDA en x=78,y=110 -->
      <path d="M 510,30 L 122,30 L 78,110 L 122,190 L 510,190 Z"/>
    </clipPath>
    <clipPath id="cInnerR">
      <path d="M 500,44 L 130,44 L 90,110 L 130,176 L 500,176 Z"/>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════════
       LISTÓN — punta a la IZQUIERDA (78,110)
  ══════════════════════════════════ -->

  <!-- Sombra -->
  <path d="M 510,30 L 122,30 L 78,110 L 122,190 L 510,190 Z"
        fill="#000818" opacity="0.3" transform="translate(-3,10)" filter="url(#fshadowR)"/>

  <!-- Marco dorado -->
  <path d="M 510,30 L 122,30 L 78,110 L 122,190 L 510,190 Z"
        fill="url(#gldR)"/>
  <!-- Bevel superior -->
  <path d="M 510,30 L 122,30 L 114,40 L 510,40 Z" fill="white" opacity="0.22"/>

  <!-- Cuero azul -->
  <path d="M 500,44 L 130,44 L 90,110 L 130,176 L 500,176 Z"
        fill="url(#lthR)"/>
  <path d="M 500,44 L 130,44 L 90,110 L 130,176 L 500,176 Z"
        fill="url(#lthR)" filter="url(#ftexR)" opacity="0.35"/>

  <!-- Franjas doradas -->
  <path d="M 500,44 L 130,44 L 122,58 L 500,58 Z" fill="url(#gldR)" opacity="0.55"/>
  <path d="M 500,176 L 130,176 L 122,162 L 500,162 Z" fill="url(#gldR)" opacity="0.55"/>

  <!-- Costuras (espejo: de derecha a izq) -->
  <path d="M 496,56 L 130,56 L 120,68" fill="none"
        stroke="#f2d858" stroke-width="1.3" stroke-dasharray="7,5" opacity="0.8"/>
  <path d="M 496,162 L 130,162 L 120,150" fill="none"
        stroke="#f2d858" stroke-width="1.3" stroke-dasharray="7,5" opacity="0.8"/>
  <path d="M 498,64 L 130,64 L 112,80" fill="none"
        stroke="#c89020" stroke-width="0.9" opacity="0.45"/>
  <path d="M 498,154 L 130,154 L 112,138" fill="none"
        stroke="#c89020" stroke-width="0.9" opacity="0.45"/>

  <!-- ══ ARABESCOS (espejo horizontal) ══ -->
  <g fill="none" stroke="url(#araR)" filter="url(#frelR)">
    <!-- Espejamos: el "x=50" del izquierdo se convierte en x=470, x=205→x=315, etc. -->
    <path d="M 470,110 C 420,110 365,110 315,110" stroke-width="3.8"/>
    <path d="M 470,110 C 476,82 460,54 432,60 C 404,66 394,88 410,99 C 426,110 442,97 434,86 C 426,75 414,82 421,90" stroke-width="3"/>
    <path d="M 470,110 C 476,138 460,166 432,160 C 404,154 394,132 410,121 C 426,110 442,123 434,134 C 426,145 414,138 421,130" stroke-width="3"/>
    <path d="M 410,99 C 392,86 368,78 345,80 C 322,82 310,95 322,104" stroke-width="2.4"/>
    <path d="M 322,104 C 313,97 303,101 305,109 C 307,117 316,118 320,112 C 324,106 319,101 316,105" stroke-width="2"/>
    <path d="M 410,121 C 392,134 368,142 345,140 C 322,138 310,125 322,116" stroke-width="2.4"/>
    <path d="M 322,116 C 313,123 303,119 305,111 C 307,103 316,102 320,108 C 324,114 319,119 316,115" stroke-width="2"/>
    <path d="M 315,110 C 302,93 272,88 255,99 C 244,107 249,114 255,121 C 272,132 302,127 315,110 Z" stroke-width="2.7"/>
    <path d="M 313,110 C 294,104 270,104 256,110 C 270,116 294,116 313,110" stroke-width="1.3" opacity="0.65"/>
    <path d="M 288,96 C 282,88 274,92 276,98" stroke-width="1.7"/>
    <path d="M 288,124 C 282,132 274,128 276,122" stroke-width="1.7"/>
    <path d="M 255,99 C 230,90 202,88 184,94" stroke-width="2.2"/>
    <path d="M 184,94 C 172,87 162,92 165,101 C 168,110 178,109 179,102" stroke-width="1.8"/>
    <path d="M 255,121 C 230,130 202,132 184,126" stroke-width="2.2"/>
    <path d="M 184,126 C 172,133 162,128 165,119 C 168,110 178,111 179,118" stroke-width="1.8"/>
    <path d="M 458,80 C 466,65 478,63 482,72 C 486,81 478,88 470,83" stroke-width="2"/>
    <path d="M 458,140 C 466,155 478,157 482,148 C 486,139 478,132 470,137" stroke-width="2"/>
    <path d="M 372,86 C 348,80 320,78 298,82" stroke-width="1.6"/>
    <path d="M 372,134 C 348,140 320,142 298,138" stroke-width="1.6"/>
  </g>

  <g fill="none" stroke="#fffac8" filter="url(#fglowR)" opacity="0.2">
    <path d="M 470,110 C 420,110 365,110 315,110" stroke-width="1.6"/>
    <path d="M 470,110 C 476,82 460,54 432,60 C 404,66 394,88 410,99 C 426,110 442,97 434,86 C 426,75 414,82 421,90" stroke-width="1.2"/>
    <path d="M 470,110 C 476,138 460,166 432,160 C 404,154 394,132 410,121 C 426,110 442,123 434,134 C 426,145 414,138 421,130" stroke-width="1.2"/>
    <path d="M 315,110 C 302,93 272,88 255,99 C 244,107 249,114 255,121 C 272,132 302,127 315,110 Z" stroke-width="1.3"/>
  </g>

  <!-- ══ TACHUELA DIAMANTE (espejo, cerca punta izquierda) ══ -->
  <polygon points="152,94 133,103 133,117 152,126 162,110"
           fill="#000818" opacity="0.35" transform="translate(-3,4)"/>
  <polygon points="152,94 133,103 133,117 152,126 162,110"
           fill="url(#diamR)"/>
  <polygon points="162,110 152,94 152,103 159,110" fill="white" opacity="0.42"/>
  <polygon points="152,94 133,103 140,103 152,99"  fill="white" opacity="0.30"/>
  <polygon points="160,110 152,95 149,99 157,110"  fill="white" opacity="0.55"/>
  <circle cx="157" cy="99" r="5" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.7;0.2;0;0;0;0.6;0.1;0"
      dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ FLECO (TASSEL) — centrado en la punta IZQUIERDA (78,110) ══ -->

  <!-- Cuello horizontal izquierdo -->
  <rect x="56" y="104" width="22" height="12" rx="5"
        fill="url(#tcupR)"/>
  <line x1="59" y1="107" x2="74" y2="107" stroke="#f2d858" stroke-width="0.9" opacity="0.7"/>
  <line x1="59" y1="110" x2="74" y2="110" stroke="#f2d858" stroke-width="0.9" opacity="0.7"/>
  <line x1="59" y1="113" x2="74" y2="113" stroke="#f2d858" stroke-width="0.9" opacity="0.7"/>

  <!-- Bola metálica centrada en y=110, a x=43 -->
  <circle cx="43" cy="110" r="15" fill="#000818" opacity="0.3" transform="translate(-2,4)"/>
  <circle cx="43" cy="110" r="15" fill="url(#ballR)"/>
  <circle cx="49" cy="104" r="5"   fill="white" opacity="0.52"/>
  <circle cx="51" cy="102" r="2.5" fill="white" opacity="0.82"/>

  <!-- Cuello inferior bola -->
  <rect x="35" y="124" width="16" height="10" rx="4"
        fill="url(#tcupR)"/>

  <!-- HILOS del fleco — cuelgan desde (43,134) hacia abajo -->
  <g opacity="0.94">
    <line x1="24"  y1="134" x2="20"  y2="195" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="28"  y1="134" x2="26"  y2="198" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="32"  y1="134" x2="30"  y2="200" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="36"  y1="134" x2="35"  y2="201" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="40"  y1="134" x2="40"  y2="201" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="44"  y1="134" x2="45"  y2="201" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="48"  y1="134" x2="50"  y2="200" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="52"  y1="134" x2="56"  y2="198" stroke="url(#thlR)" stroke-width="1.6"/>
    <line x1="56"  y1="134" x2="62"  y2="195" stroke="url(#thlR)" stroke-width="1.6"/>
    <!-- Brillos hilos -->
    <line x1="26"  y1="134" x2="23"  y2="196" stroke="#f8e870" stroke-width="0.7" opacity="0.55"/>
    <line x1="32"  y1="134" x2="31"  y2="199" stroke="#f8e870" stroke-width="0.7" opacity="0.55"/>
    <line x1="38"  y1="134" x2="38"  y2="201" stroke="#f8e870" stroke-width="0.7" opacity="0.55"/>
    <line x1="44"  y1="134" x2="45"  y2="201" stroke="#f8e870" stroke-width="0.7" opacity="0.55"/>
    <line x1="50"  y1="134" x2="53"  y2="200" stroke="#f8e870" stroke-width="0.7" opacity="0.55"/>
    <line x1="56"  y1="134" x2="60"  y2="196" stroke="#f8e870" stroke-width="0.7" opacity="0.55"/>
    <!-- Remate punta fleco -->
    <ellipse cx="41"  cy="198" rx="22" ry="5" fill="url(#tcupR)" opacity="0.9"/>
    <ellipse cx="43"  cy="197" rx="9"  ry="2.5" fill="#f2d858" opacity="0.45"/>
  </g>

  <!-- ══ ILUMINACIÓN ANIMADA ══ -->
  <path d="M 500,44 L 130,44 L 90,110 L 130,176 L 500,176 Z"
        fill="url(#lsweepR)" clip-path="url(#cInnerR)"/>
  <path d="M 510,30 L 122,30 L 78,110 L 122,190 L 510,190 Z"
        fill="url(#gldsweepR)" clip-path="url(#cOuterR)" opacity="0.65"/>

  <!-- Destello bola -->
  <circle cx="50" cy="104" r="6" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0;0.72;0.18;0;0;0;0.55;0.12;0"
      dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;4;7;5;4;4;4;6;4;4"
      dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulso arabescos -->
  <path d="M 500,44 L 130,44 L 90,110 L 130,176 L 500,176 Z"
        fill="white" opacity="0" clip-path="url(#cInnerR)">
    <animate attributeName="opacity" values="0;0.05;0;0.04;0"
      dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>

</svg>
